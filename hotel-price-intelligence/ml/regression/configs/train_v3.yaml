# Cau hinh huan luyen v3 (thread discuss/model-results-improvement-20261008; GPT PASS DIAGNOSIS AND PLAN file 14; hop dong C1-C18 o file 11 + 13).
# v2 (train_v2.yaml) va ket qua v2 BAT BIEN. Doi bat ky dong nao => config_sha256 moi. Moi sieu tham so nam o day, khong hardcode trong code.
version: train-v3.0.0
seed: 20261008

horizons: [1, 3, 7, 14]
target_transform: log_ratio          # z = log(y/current); price = current*exp(z_hat); persistence = z_hat 0
accuracy_tolerance: 0.20             # chi de bao cao (bao hoa: persistence da ~94-96%)
stable_threshold: 0.02               # |y/current - 1| > 0.02 = "doi" (dinh nghia RATIO, C1)
primary_requires_seen_hotel: true
min_rows: {train: 300, validation: 100, test: 100}

# Hang so hoa tie DUY NHAT tren thang lift (so voi persistence tren cung hang) - dung o CV, validation, routing, champion (C17).
tie_atol: 1.0e-12

bootstrap: {n: 2000, seed: 20261008}   # theo cum khach san, quan the hotel cua CA split, draw chung, hotel vang mat dong gop 0

# Purged expanding-window CV tren TRAIN (min_train_days=14, gap=h). h1 3 fold, h3 2 fold (so ngay thuc: h1 4/4/3, h3 3/2).
cv:
  min_train_days: 14
  n_splits: {"1": 3, "3": 2, "7": 2, "14": 2}

# ----- 3 ho duoc tune (C2/C3): moi ho 12 candidate lay mau MOT LAN (ParameterSampler, seed), dung chung cho scorer A va B.
tuning:
  n_iter: 12
  sampler_seed: 20261008
  # Khong early stopping o v3: so vong co dinh theo candidate.
  families:
    hgb_l1:
      kind: hgb
      loss: absolute_error
      fixed: {max_leaf_nodes: 31, max_bins: 255, l2_regularization: 0.0, max_features: 1.0, early_stopping: false, warm_start: false, categorical_features: null}
      space:
        max_depth: [2, 3, 4, 6]
        learning_rate: [0.03, 0.05, 0.1]
        max_iter: [100, 150, 300]
        min_samples_leaf: [20, 50, 100]
    xgb_abs:
      kind: xgb
      objective: "reg:absoluteerror"
      fixed: {tree_method: hist}
      space:
        max_depth: [2, 3, 4]
        learning_rate: [0.03, 0.05, 0.1]
        n_estimators: [100, 200, 300]
        min_child_weight: [5, 20, 50]
        subsample: [0.7, 1.0]
        colsample_bytree: [0.7, 1.0]
        reg_lambda: [1, 10]
    xgb_ph:
      kind: xgb
      objective: "reg:pseudohubererror"
      fixed: {tree_method: hist}
      space:
        max_depth: [2, 3, 4]
        learning_rate: [0.03, 0.05, 0.1]
        n_estimators: [100, 200, 300]
        min_child_weight: [5, 20, 50]
        subsample: [0.7, 1.0]
        colsample_bytree: [0.7, 1.0]
        reg_lambda: [1, 10]
        huber_slope: [0.02, 0.05, 0.1]

# Thu tu uu tien khi tie giua cac ung vien hoc duoc (persistence luon thang khi hoa - C5'): ho -> controls.
  family_order: [hgb_l1, xgb_abs, xgb_ph]
  control_order: [hgb_l2, xgb_l2, rf_l2, ridge]

# ----- controls co dinh (C6): day du tham so + seed.
controls:
  hgb_l2:
    kind: hgb
    loss: squared_error
    params: {max_iter: 150, max_depth: 3, learning_rate: 0.05, min_samples_leaf: 20, max_leaf_nodes: 31, max_bins: 255, l2_regularization: 0.0,
             max_features: 1.0, early_stopping: false, warm_start: false, categorical_features: null}
  xgb_l2:
    kind: xgb
    objective: "reg:squarederror"
    params: {tree_method: hist, max_depth: 3, learning_rate: 0.05, n_estimators: 150, min_child_weight: 5, subsample: 1.0, colsample_bytree: 1.0, reg_lambda: 1}
  rf_l2:
    kind: rf
    params_by_horizon:                      # tham so RF v2 da chon (report v2 that) - CHI h1/h3; h7/h14 CHUA co tham so da chot => train-v3 TU CHOI (validate_horizon_support), khong copy tu h3
      "1": {n_estimators: 200, max_depth: 6, max_features: 0.3, min_samples_leaf: 1}
      "3": {n_estimators: 200, max_depth: 6, max_features: 0.3, min_samples_leaf: 3}
  ridge:
    kind: ridge
    params: {alpha: 10.0}

# ----- ablation MOT ho, MOT khoi (C10'): quyet theo TUNG horizon, chi TRAIN/CV/VALIDATION.
ablation:
  enabled: true
  family: hgb_l1
  block_version: ratio-1.0
  accept: {validation_incr_lift_ci_lower_gt: 0.0, cv_every_fold_mae_vnd_lower: true}

# ----- routing theo inference_mode (C12), tu VALIDATION; ordinary KHONG tham gia.
routing:
  modes: [cold_start, history_enriched]
  min_rows: 300
  min_hotels: 20
  min_dates: 3

# ----- null hoan vi nhan trong ngay quan sat (C11), cho cau hinh champion_A.
null_test: {enabled: true, n: 10, seed_base: 20261008}

# ----- canh bao pham vi tuyen bo (C14): ordinary < -2% => khong goi "cai thien rong". KHONG la selector.
claims: {ordinary_warning_threshold: -0.02}

# ----- ngan sach (C7'): mem, kiem dong ho truoc moi candidate; ho vuot budget => family_incomplete (khong lay interim best).
budget:
  time_budget_seconds: 2400             # mem; so fit danh nghia (can tren) duoc tinh trong report tu so ho/n_iter/fold/controls/null; pilot = candidate dau tien cua moi ho (khong them fit)
  seed_stability: false                 # cho phep bat chi khi ghi so fit truoc chay (mac dinh TAT: 0 fit)

# ----- moi truong (C9'): mac dinh fail-closed khi lech; ALLOW_ENV_DRIFT la opt-in tuong minh truoc moi fit.
environment:
  expected_versions: {scikit-learn: "1.6.1", xgboost: "3.4.1", numpy: "2.1.3", pandas: "2.2.3"}
  record_only: [python, pyarrow, joblib, pyyaml]
