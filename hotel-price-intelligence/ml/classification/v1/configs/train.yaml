# Cau hinh classification v1 (thread discuss/classification-model-20261019; GPT PASS PLAN file 06). Phien ban = thu muc `v1/`, ten file KHONG co hau to version.
# config_sha256 = hash cua cau hinh DA PARSE: doi gia tri/khoa => hash moi => chay lai cong (comment va dinh dang YAML khong doi danh tinh).
# Cau hinh duoc VALIDATE khi nap (cls_training.config.validate_config): moi horizon dung 1 dataset pin + 1 snapshot pin; nhan/nguong co dinh. Giai doan hien tai: CODE (baseline da PASS; runner/ung vien dang duoc viet).
config_stage: code
seed: 20261019
horizons: [1, 3]

labels:
  threshold: 0.02                     # hop dong nhan (LABEL_CONTRACT); validator tu tinh lai (y-c)/c va doi chieu 100%
  classes: [down, stable, up]         # chi so 0, 1, 2

primary_requires_seen_hotel: true     # val/test chi giu hotel co >= 1 mau train usable cung horizon (runner.horizon_frames)

cv:                                   # PurgedExpandingWindowSplit, gap = horizon (giong regression train_v3.yaml)
  min_train_days: 14
  n_splits: {"1": 3, "3": 2}

panel:                                # EVAL_PROTOCOL §4
  momentum_threshold: 0.02            # C1: up neu price_velocity > +0.02, down neu < -0.02, NaN => stable
  tie_atol: 1.0e-9
  practical_gain_macro_f1: 0.02       # minimum practical effect (khoa truoc test)

bootstrap: {n: 2000, seed: 20261019, min_valid_fraction: 0.99}

# ---- Ung vien + ngan sach (EVAL_PROTOCOL §3). sampling_strategy=paired_weight (GPT 12 §3.1): ParameterSampler co seed chon `n_configs` cau hinh sieu tham so KHONG gom trong so;
# moi cau hinh chay ca weight=none va weight=balanced (fold-local) => quota khoa 6/8/8 = 2 x 3/4/4, tuong phan trong so tren CUNG sieu tham so. KHONG grid sau random.
tuning:
  sampler_seed: 20261019
  sampling_strategy: paired_weight
  candidate_set_sha256: "63de924cdd2536f65d5081ecb0e139d70bcb0037122b82abe7b32d772e404723"   # van tay tap 22 ung vien da lay mau (id/ho/thu tu/tham so); lech (phien ban sklearn/sampler) => dung som
  family_order: [lr, hgb, xgb]                  # thu tu don gian (hoa => ho don gian hon); cung la thu tu chay
  families:
    lr:
      kind: linear
      n_candidates: 6
      n_configs: 3
      weights: [none, balanced]
      fixed: {max_iter: 2000, solver: lbfgs}
      space: {C: [0.01, 0.1, 1, 10]}
    hgb:
      kind: tree
      n_candidates: 8
      n_configs: 4
      weights: [none, balanced]
      fixed: {loss: log_loss, early_stopping: false}
      space: {max_depth: [3, 4, 6], learning_rate: [0.05, 0.1], max_iter: [100, 200, 300], min_samples_leaf: [20, 50, 100], l2_regularization: [0.0, 1.0]}
    xgb:
      kind: tree
      n_candidates: 8
      n_configs: 4
      weights: [none, balanced]
      fixed: {objective: "multi:softprob", tree_method: hist}
      space: {max_depth: [2, 3, 4, 6], learning_rate: [0.05, 0.1], n_estimators: [100, 200, 300], min_child_weight: [5, 20, 50], subsample: [0.7, 1.0], colsample_bytree: [0.7, 1.0], reg_lambda: [1.0, 10.0]}

# Ablation CHAN DOAN (khong doi champion): refit champion tren train, cung ho/sieu tham so/loai trong so, chi khac tap feature.
ablation: {a1: a1_ratio, a2: a2_no_history, a2_n_features: 21}

# Moi truong FAIL-CLOSED (khong co co cho phep lech): scikit-learn/numpy/pandas = phien ban bo test cuc bo da chay; xgboost = ban Colab da chay thanh cong cho regression cua du an.
# Lech => dung som (notebook cai dung roi Restart session). `record_only` chi ghi vao environment_resolved/manifest.
environment:
  expected_versions: {scikit-learn: "1.7.2", numpy: "2.1.3", pandas: "2.3.3", xgboost: "3.4.1"}
  record_only: [python, pyarrow, scipy, joblib, pyyaml]

run:
  device: cuda                                  # xgb; 'cpu' cho test/may chinh. Yeu cau cuda ma khong co GPU => loi (khong am tham chay CPU)
  wall_clock_soft_cap_seconds: 7200             # MEM, kiem giua cac fit (mot fit dang chay co the vuot gio)
  n_jobs: -1
  probability_tolerance: 1.0e-5                 # tong hang xac suat == 1

