# Cau hinh huan luyen v2 (CLAUDE.md muc 3, 9, 10; GPT file 50 muc 5: chon mo hinh theo validation MAE). v1 giu nguyen de tai lap. Moi sieu tham so nam o day, khong hardcode trong code.
# Doi bat ky dong nao => config_sha256 moi (ghi vao metadata cua model).
version: train-v2.0.0
seed: 20261006

horizons: [1, 3, 7, 14]

# Muc tieu mo hinh: log(y_price / current_price). Persistence baseline = du doan 0. Metric luon tinh tren thang gia (VND).
target_transform: log_ratio          # log_ratio | log_price | price

# Dung chung moi metric (CLAUDE.md muc 9): Accuracy@20% >= 80% la muc toi thieu cua project.
accuracy_tolerance: 0.20
stable_threshold: 0.02               # nguong +-2% cho huong suy ra tu hoi quy

# Nhom feature loai khoi mo hinh (ablation); cot trong `forbidden_features` cua dataset luon bi chan cung.
exclude_groups: []                   # vd: ["listing_signals"]
exclude_columns: []                  # vd: ["hotel_id"] - hotel_id vốn khong phai feature (nhom identifier)

# Tap val/test co 'primary' chi gom khach san da co mau o train (hotel_seen_in_train) - dataset da danh dau san.
primary_requires_seen_hotel: true

# Du lieu toi thieu moi tap (duoi nguong => bo qua horizon + ghi ro ly do, khong ep chay).
min_rows: {train: 300, validation: 100, test: 100}

# Cross-validation theo thoi gian co purge (khoang cach = horizon): train < val_start - horizon.
cv:
  n_splits: 4
  min_train_days: 14

scoring: neg_mean_absolute_error     # tren muc tieu da bien doi (log_ratio ~ sai so tuong doi)
n_jobs: -1

models:
  ridge:
    alpha: 10.0
  rf:
    fixed: {n_jobs: -1}
    random_search:
      n_iter: 12
      space:
        n_estimators: [100, 200, 300]
        max_depth: [6, 10, 14, null]
        min_samples_leaf: [1, 3, 5, 10, 20]
        max_features: [0.3, 0.5, 0.7, 1.0]
  xgb:
    fixed: {tree_method: hist, n_jobs: -1, objective: "reg:squarederror"}
    random_search:
      n_iter: 12
      space:
        n_estimators: [150, 300, 500]
        max_depth: [3, 4, 6, 8]
        learning_rate: [0.03, 0.05, 0.1]
        subsample: [0.7, 0.85, 1.0]
        colsample_bytree: [0.5, 0.7, 1.0]
        min_child_weight: [1, 5, 10]

# Chon mo hinh cuoi theo tap VALIDATION (khong bao gio theo test): MAE thap nhat (min); hoa -> sMAPE thap hon (min); hoa nua -> ten mo hinh tang dan (xac dinh).
# Accuracy@tol (muc tieu >= 80% cua project) la guard/bao cao, KHONG la tieu chi xep hang duy nhat: persistence da dat ~96% (h1) nen no khong phan biet duoc mo hinh.
# `directions` ghi tuong minh chieu tot cua tung metric - runner xep theo chieu nay (khong con coi moi metric la 'cang lon cang tot').
selection:
  primary_metric: mae
  tie_break: smape
  final_tie: model_name_asc
  directions: {mae: min, smape: min, rmse: min, accuracy_at_tol: max}
